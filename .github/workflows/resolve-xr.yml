name: resolve-xr-symbols

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'artifact 所在的 run id'
        required: true
        default: '42525889812'
      artifact_name:
        description: 'artifact 名'
        required: true
        default: 'dsc-22H31-XR'

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取脚本
        uses: actions/checkout@v4

      - name: 下载已提取的 dsc 产物
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: work

      - name: 看目录
        run: |
          set -x
          find work -maxdepth 4 -type d | head -20
          find work -name 'dyld_shared_cache_arm64e*' | head -5
          du -sh work || true

      - name: 解析 53 个符号
        working-directory: work
        run: |
          set -x
          cp ../runner_resolve.py .
          cp ../targets.json .
          python3 -V
          python3 runner_resolve.py 2>&1

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: xr-symbols
          path: |
            work/xr_symbols.json
            work/xr_images.json
          retention-days: 7
